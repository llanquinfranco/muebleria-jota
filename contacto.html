<!-- Contacto
contacto.html
Formulario: Nombre, Email, Mensaje
Validación del lado del cliente con JS
Mensaje de éxito mediante DOM
Carrito simulado con contador en header -->

<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contacto - Hermanos Jota</title>
        <link rel="stylesheet" href="css/styles.css" />
        <link rel="icon" href="assets/icons/logo.svg" />
    </head>
    <body>
        <main>
            <section id="contacto-formulario">
                <h2>Centro de ayuda y contacto</h2>
                <p>Completá los datos y te responderemos a la brevedad</p>

                <form id="form-contacto">
                    <label for="nombre">Nombre y Apellido</label>
                    <input type="text" id="nombre" minlength="8" required />

                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" required/>

                    <label for="mensaje">Tu Consulta / Feedback</label>
                    <textarea name="mensaje" id="" rows="5" minlength="15" required></textarea>

                    <button type="submit" class="boton-primario">Enviar Mensaje</button>
                </form>
                <h3 id="mensaje-exito" style="display: none;">¡Tu consulta fue enviada correctamente y ya la recibimos!</h3>
            </section>
        </main>

        <script type="module" src="js/contacto.js"></script>
    </body>
</html>
